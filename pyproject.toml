[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "healthcare-agent-ops-kit"
version = "0.1.0"
description = "Reference kit for building PHI-safe AI agents and an AI-assisted engineering workflow (MCP server, skills, Claude Code config, review bot, evals) for regulated healthcare operations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastián Larrauri" }]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
opskit-mcp = "opskit.mcp_server.server:main"
opskit-review = "opskit.review.cli:main"
opskit-evals = "opskit.evals.runner:main"
opskit-audit-verify = "opskit.audit:verify_main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opskit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=opskit --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", ".claude/hooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "PT", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", ".claude/hooks"]
plugins = ["pydantic.mypy"]
