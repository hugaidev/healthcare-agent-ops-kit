name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra llm --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (coverage gate in pyproject)
        run: uv run pytest
      - name: Evals (accuracy, unsafe-action rate, PHI leaks)
        run: uv run opskit-evals
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/

  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Compliance rules (PHI, audit, secrets, Terraform)
        run: uv run opskit-review scan src infra --format sarif --output opskit.sarif --fail-on high
      - name: Keep SARIF report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-sarif
          path: opskit.sarif
      # Code scanning needs a public repo or GitHub Advanced Security.
      - name: Upload SARIF to code scanning
        if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: opskit.sarif

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit
      # Open-source CLI: the gitleaks GitHub Action requires a paid license for organizations.
      - name: Secret scan (gitleaks CLI)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
